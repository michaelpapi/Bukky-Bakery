# One repo, one Netlify site per client. Set CLIENT=<slug> in each site's environment variables
# (Site settings > Environment variables). Do NOT hard-code it here: this file applies to every site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# hashed build assets never change
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# client images keep their file names, so cache for a week rather than forever
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
